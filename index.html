<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="返し">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>返し</title>
<style>
:root{
  --paper:#fbfaf6; --grid:#f1f0eb; --ink:#1a1a1a; --mid:#8a8880; --soft:#d3d0c6;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --g:22px;                                   /* 方眼のひと目 */
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#121211; --grid:#171716; --ink:#e9e7e1; --mid:#7c7a74; --soft:#34332f; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:var(--g) var(--g);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--sans);
  padding:calc(env(safe-area-inset-top) + 8px) 22px calc(env(safe-area-inset-bottom) + 8px);
  display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:baseline;height:44px;
  font-size:11px;letter-spacing:.14em;color:var(--mid)}
main{flex:1;display:flex;flex-direction:column;max-width:460px;width:100%;margin:0 auto}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
.spacer{flex:1}

/* 文字 */
.label{font-size:11px;letter-spacing:.2em;color:var(--mid);margin:22px 0 8px}
.q{font-family:var(--serif);font-size:25px;line-height:1.55;letter-spacing:.02em}
.q.s{font-size:17px}
.sub{font-size:13px;color:var(--mid);line-height:1.8}

/* ボタンは文字だけ。主役だけ黒丸・黒帯 */
.link{font-size:14px;letter-spacing:.08em;color:var(--mid);padding:10px 2px}
.link.ink{color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.link:disabled{opacity:.3;text-decoration:none}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 0 18px}

/* 答え：メモの行 */
.lines{margin:14px 0 24px;list-style:none}
.lines li{font-family:var(--serif);font-size:16px;line-height:var(--g);padding:5.5px 0;
  display:flex;gap:10px;animation:in .25s ease-out}
.lines li::before{content:"—";color:var(--mid)}
.lines li small{font-family:var(--sans);font-size:10px;color:var(--mid);letter-spacing:.05em;margin-left:auto;white-space:nowrap;padding-left:8px}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.live{min-height:22px;font-family:var(--serif);font-size:15px;color:var(--mid);margin-top:8px}

/* 入力 */
.qhead{display:flex;justify-content:space-between;align-items:baseline}
.tiny{font-size:11px;color:var(--mid);letter-spacing:.1em;padding:6px 0}
.count{font-size:11px;color:var(--mid);letter-spacing:.12em}
.type{display:flex;gap:10px;align-items:flex-end;margin-top:18px;border-bottom:1px solid var(--ink)}
.type textarea{flex:1;background:transparent;border:none;resize:none;overflow:hidden;
  font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--ink);padding:8px 0;outline:none;border-radius:0}
.type textarea::placeholder{color:var(--mid);font-size:14px}
.add{font-size:13px;color:var(--mid);padding:8px 0}
.acts{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.pill{font-size:14px;letter-spacing:.08em;padding:10px 18px;border:1px solid var(--soft);border-radius:999px;background:var(--paper)}
.pill.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill:disabled{opacity:.25}

/* ヒント：付箋のように一枚 */
.hint{display:none;margin-top:16px;padding:12px 0 2px 14px;border-left:2px solid var(--ink);animation:in .3s ease-out}
.hint.on{display:block}
.hint .k{font-size:10px;letter-spacing:.22em;color:var(--mid)}
.hint .s{font-family:var(--serif);font-size:19px;line-height:1.6;margin:0 0 4px}
.hint .s .b{display:inline-block;min-width:3.2em;border-bottom:1.5px solid var(--ink);margin:0 2px;transform:translateY(-4px)}
.hint .n{font-size:12px;color:var(--mid);line-height:1.7}

/* 丸 */
.circle{position:relative;width:min(90vw,420px);aspect-ratio:1;margin:12px auto 0}
.circle .ring{position:absolute;inset:14%;border:1px solid var(--ink);border-radius:50%}
.circle .center{position:absolute;inset:25%;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:8px;font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--mid)}
.circle .center.sel{color:var(--ink);font-size:16px}
.dot{position:absolute;transform:translate(-50%,-50%);max-width:27%;background:var(--paper);
  padding:4px 8px;font-family:var(--serif);font-size:12px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border:1px solid var(--soft);border-radius:999px;transition:all .2s}
.dot.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* 名人 */
.mine{font-family:var(--serif);font-size:17px;line-height:1.7}
.cards{display:flex;flex-direction:column;margin-top:4px}
.card{text-align:left;width:100%;padding:16px 0;border-top:1px solid var(--soft)}
.card:last-child{border-bottom:1px solid var(--soft)}
.card.shut{color:var(--mid);font-size:13px;letter-spacing:.2em}
.card .t{font-size:10px;letter-spacing:.2em;color:var(--mid);margin-bottom:6px;display:flex;gap:10px}
.card .r{font-family:var(--serif);font-size:17px;line-height:1.75}
.card .w{font-size:12px;color:var(--mid);margin-top:8px;line-height:1.7}
.card.open{animation:in .3s ease-out}
.same{color:var(--ink);letter-spacing:.05em}

/* 思い出す */
.reveal{margin-top:20px;min-height:80px;font-family:var(--serif);font-size:19px;line-height:1.65}
.reveal.hide{color:transparent;text-shadow:0 0 12px var(--mid);user-select:none}

/* おわり・ネタ帳 */
.big{font-family:var(--serif);font-size:64px;text-align:center;margin-top:56px;line-height:1}
.center-t{text-align:center;margin-top:14px}
.book-item{padding:12px 0;border-top:1px solid var(--soft)}
.book-item .d{font-size:10px;color:var(--mid);letter-spacing:.12em}
.book-item .qq{font-size:12px;color:var(--mid);margin:4px 0}
.book-item .aa{font-family:var(--serif);font-size:16px;line-height:1.65}
textarea.io{width:100%;height:110px;background:transparent;color:var(--ink);border:1px solid var(--soft);padding:8px;font-size:11px;margin-top:6px}
</style>
</head>
<body>
<header>
  <span id="streak">返し</span>
  <button id="toBook" class="count">ネタ帳</button>
</header>
<main>

<section class="screen" id="s-recall">
  <div class="label">きのうの一本　見ずに、口に出す</div>
  <div class="q" id="rq"></div>
  <div class="reveal hide" id="ra"></div>
  <div class="spacer"></div>
  <div class="bar" id="rfoot1"><span></span><button class="link ink" id="rShow">言った。答えを見る</button></div>
  <div class="bar" id="rfoot2" style="display:none">
    <button class="link" id="rNo">出なかった</button>
    <button class="link ink" id="rYes">言えた</button>
  </div>
</section>

<section class="screen" id="s-ask">
  <div class="qhead"><span class="label">きょうの問い</span><button class="tiny" id="reroll">別の問い</button></div>
  <div class="q" id="q"></div>
  <div class="type"><textarea id="typed" rows="1" placeholder="キーボードのマイクで、声で答える" enterkeyhint="send"></textarea><button class="add" id="add">足す</button></div>
  <div class="acts">
    <button class="pill" id="hintBtn">ヒント</button>
    <span class="count" id="count"></span>
    <button class="pill ink" id="toPick" disabled>一本えらぶ</button>
  </div>
  <div class="hint" id="hint"><div class="s" id="hintS"></div><div class="n" id="hintN"></div></div>
  <ul class="lines" id="answers"></ul>
</section>

<section class="screen" id="s-pick">
  <div class="label">一本えらぶ</div>
  <div class="q s" id="pq"></div>
  <div class="circle" id="circle"><div class="ring"></div><div class="center" id="center">触れて、えらぶ</div></div>
  <div class="spacer"></div>
  <div class="bar">
    <button class="link" id="back">もっと言う</button>
    <button class="link ink" id="decide" disabled>これにする</button>
  </div>
</section>

<section class="screen" id="s-master">
  <div class="label">あなたの一本</div>
  <div class="mine" id="mine"></div>
  <div class="label" style="margin-top:28px">名人なら　めくる</div>
  <div class="cards" id="cards"></div>
  <div class="spacer"></div>
  <div class="bar"><span></span><button class="link ink" id="finish" disabled>きょうはおわり</button></div>
</section>

<section class="screen" id="s-done">
  <div class="big" id="dnum"></div>
  <div class="sub center-t" id="dtext"></div>
  <div class="spacer"></div>
  <div class="bar"><span></span><button class="link" id="again">もう一問</button></div>
</section>

<section class="screen" id="s-book">
  <div class="label" id="bookHead">ネタ帳</div>
  <div id="book"></div>
  <div class="bar">
    <button class="link" id="ioToggle">引っ越し</button>
    <button class="link ink" id="bookBack">もどる</button>
  </div>
  <div id="io" style="display:none;padding-bottom:20px">
    <textarea class="io" id="ioText"></textarea>
    <div class="bar"><button class="link" id="ioOut">書き出す</button><button class="link" id="ioIn">読み込む</button></div>
  </div>
</section>

</main>
<script src="data.js"></script>
<script src="hints.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = "kaeshi-v1";
const ymd = d => new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today = () => ymd(new Date());

// ---- 保存 ----
let st;
try { st = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { st = {}; }
st.entries = st.entries || [];   // {date, qid, q, answers:[{t,h}], pick, hint}
st.recall  = st.recall  || {};
st.draft   = st.draft   || null;
if (st.hv !== 3) { st.used = []; st.hv = 3; }   // ヒントを書き直したら、出した記録を戻す
st.used    = st.used    || [];   // 出したヒントのid。一巡するまで同じものは出さない
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };

function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function pickQid(salt=0){
  const done = new Set(st.entries.map(e=>e.qid));
  let pool = QUESTIONS.filter(q=>!done.has(q.id));
  if (!pool.length) pool = QUESTIONS;
  return pool[hash(today()+":"+salt) % pool.length].id;
}
const Q = id => QUESTIONS.find(q=>q.id===id);

function show(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id==="s-"+name));
  window.scrollTo(0,0);
}
function streak(){
  const days = new Set(st.entries.map(e=>e.date));
  let n=0, d=new Date();
  if (!days.has(today())) d.setDate(d.getDate()-1);
  while (days.has(ymd(d))) { n++; d.setDate(d.getDate()-1); }
  $("streak").textContent = n ? `返し　${n}日目` : "返し";
  return n;
}

// ---- 起動 ----
let cur, salt = 0;
function start(){
  streak();
  const due = st.entries.findIndex(e => e.date < today() && !e.recalled && (e.nextRecall||"") <= today());
  if (due >= 0 && st.recall.date !== today()) return showRecall(due);
  beginAsk();
}
function beginAsk(){
  if (st.draft && st.draft.date === today()) cur = st.draft;
  else { cur = { date: today(), qid: pickQid(salt), answers: [] }; st.draft = cur; save(); }
  resetHint(); renderAsk(); show("ask");
}

// ---- 思い出す ----
let rIdx;
function showRecall(i){
  rIdx = i; const e = st.entries[i];
  $("rq").textContent = e.q; $("ra").textContent = e.pick; $("ra").classList.add("hide");
  $("rfoot1").style.display=""; $("rfoot2").style.display="none";
  show("recall");
}
$("rShow").onclick = () => { $("ra").classList.remove("hide"); $("rfoot1").style.display="none"; $("rfoot2").style.display=""; };
function recallDone(ok){
  const e = st.entries[rIdx];
  e.tries = (e.tries||0)+1;
  if (ok) e.hits = (e.hits||0)+1;
  // 言えたら3日後にもう一度、2回言えたら卒業。出なければ翌日また
  if (ok && e.hits >= 2) e.recalled = true;
  else { const d=new Date(); d.setDate(d.getDate()+(ok?3:1)); e.nextRecall = ymd(d); }
  st.recall.date = today(); save(); beginAsk();
}
$("rYes").onclick = () => recallDone(true);
$("rNo").onclick  = () => recallDone(false);

// ---- 答える ----
function renderAsk(){
  $("q").textContent = Q(cur.qid).q;
  const box = $("answers"); box.innerHTML = "";
  cur.answers.forEach(a=>{
    const li=document.createElement("li"); li.append(a.t); box.prepend(li);   // 新しい答えを上に
  });
  const n = cur.answers.length;
  $("count").textContent = n===0 ? "" : n<3 ? `${n}本　まず3本` : n<10 ? `${n}本` : `${n}本　十分`;
  $("toPick").disabled = n<2;
}
function addAnswer(t){
  t = t.trim().replace(/[。\s]+$/,""); if(!t) return;
  cur.answers.push({ t });
  st.draft = cur; save(); renderAsk();
}
// キーボードのマイクで話す。改行（送信）か「足す」で1本になる
const ta = $("typed");
const grow = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
const commit = () => { addAnswer(ta.value); ta.value = ""; grow(); ta.focus(); };
ta.oninput = () => { if (ta.value.includes("\n")) { ta.value = ta.value.replace(/\n/g,""); commit(); } else grow(); };
ta.onkeydown = e => { if (e.key==="Enter" && !e.isComposing){ e.preventDefault(); commit(); } };
$("add").onclick = commit;

// ---- ヒント ----
// この問い専用のヒントを先に、なくなったら汎用の型へ。出したものは記録して、全部出るまで繰り返さない。
// 同じ型が続かないようにする。
let curHint = null, lastType = "";
function resetHint(){ curHint=null; lastType=""; $("hint").classList.remove("on"); $("hintBtn").textContent="ヒント"; }
function nextHint(){
  const own = (QHINTS[cur.qid]||[]).map((h,i)=>({...h, id:`${cur.qid}:${i}`}));
  const gen = SPARKS.map((h,i)=>({...h, id:`g:${i}`}));
  const used = new Set(st.used);
  const order = arr => arr.sort((a,b)=>hash(today()+a.id)-hash(today()+b.id));
  let pool = order(own.filter(h=>!used.has(h.id)));
  if (!pool.length) {
    let g = gen.filter(h=>!used.has(h.id));
    if (!g.length) { st.used = st.used.filter(id=>!id.startsWith("g:")); g = gen; }   // 汎用が一巡したら戻す
    pool = order(g);
  }
  const h = pool.find(x=>x.type!==lastType) || pool[0];
  st.used.push(h.id); save();
  lastType = h.type;
  return h;
}
function blankify(s){
  const span = document.createElement("span");
  s.split("＿＿").forEach((part,i)=>{
    if (i) { const b=document.createElement("span"); b.className="b"; span.append(b); }
    span.append(part);
  });
  return span;
}
$("hintBtn").onclick = () => {
  curHint = nextHint();
  $("hintS").innerHTML = ""; $("hintS").append(blankify(curHint.s));
  $("hintN").textContent = curHint.n || "";
  $("hint").classList.remove("on"); void $("hint").offsetWidth; $("hint").classList.add("on");
  $("hintBtn").textContent = "別のヒント";
};
$("reroll").onclick = () => {
  if (cur.answers.length && !confirm("いまの答えは消えます。別の問いにしますか？")) return;
  salt++; cur = { date: today(), qid: pickQid(salt), answers: [] }; st.draft = cur; save();
  resetHint(); renderAsk();
};

// ---- 丸から一本 ----
let sel = -1;
$("toPick").onclick = () => { if (ta.value.trim()) commit(); renderPick(); show("pick"); };
function renderPick(){
  $("pq").textContent = Q(cur.qid).q;
  const c = $("circle"); c.querySelectorAll(".dot").forEach(d=>d.remove());
  sel = -1; $("decide").disabled = true; $("center").textContent = "触れて、えらぶ"; $("center").classList.remove("sel");
  const n = cur.answers.length;
  cur.answers.forEach((a,i)=>{
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const r = n>8 && i%2 ? 28 : 36;
    const d = document.createElement("button"); d.className="dot";
    d.style.left = (50 + r*Math.cos(ang))+"%"; d.style.top = (50 + r*Math.sin(ang))+"%";
    d.textContent = a.t;
    d.onclick = () => {
      c.querySelectorAll(".dot").forEach(x=>x.classList.remove("sel")); d.classList.add("sel");
      sel = i; $("center").textContent = a.t; $("center").classList.add("sel"); $("decide").disabled = false;
    };
    c.append(d);
  });
}
$("back").onclick = () => show("ask");
$("decide").onclick = () => {
  if (!st.draft || sel < 0) return;
  $("decide").disabled = true;
  const a = cur.answers[sel], q = Q(cur.qid);
  st.entries.push({ date: cur.date, qid: cur.qid, q: q.q, answers: cur.answers, pick: a.t });
  st.draft = null; save(); streak();
  renderMasters(a); show("master");
};

// ---- 名人の返し ----
function renderMasters(a){
  $("mine").textContent = a.t;
  const box = $("cards"); box.innerHTML = "";
  const ms = Q(cur.qid).m; let opened = 0;
  ms.forEach((m,i)=>{
    const c = document.createElement("button"); c.className = "card shut";
    c.textContent = ["一","二","三"][i] + "　　めくる";
    c.onclick = () => {
      if (!c.classList.contains("shut")) return;
      c.className = "card open"; c.innerHTML = "";
      const t = document.createElement("div"); t.className="t"; t.textContent = m.type;
      const r = document.createElement("div"); r.className="r"; r.textContent = "「" + m.r + "」";
      const w = document.createElement("div"); w.className="w"; w.textContent = m.w;
      c.append(t, r, w);
      if (++opened === ms.length) $("finish").disabled = false;
    };
    box.append(c);
  });
  $("finish").disabled = true;
}
$("finish").onclick = () => {
  const n = streak();
  $("dnum").textContent = st.entries.length;
  $("dtext").innerHTML = `本目が、ネタ帳に。<br>${n>1?`${n}日つづいている。<br>`:""}あした、見ずに言えるか。`;
  show("done");
};
$("again").onclick = () => { salt++; beginAsk(); };

// ---- ネタ帳 ----
$("toBook").onclick = () => {
  const b = $("book"); b.innerHTML = "";
  $("bookHead").textContent = `ネタ帳　${st.entries.length}本`;
  if (!st.entries.length) b.innerHTML = `<p class="sub">まだ空。一本えらぶと、ここに入る。</p>`;
  [...st.entries].reverse().forEach(e=>{
    const d = document.createElement("div"); d.className="book-item";
    d.innerHTML = `<div class="d"></div><div class="qq"></div><div class="aa"></div>`;
    d.querySelector(".d").textContent = e.date + (e.recalled?"　身についた":"");
    d.querySelector(".qq").textContent = e.q; d.querySelector(".aa").textContent = e.pick;
    b.append(d);
  });
  show("book");
};
$("bookBack").onclick = () => start();
$("ioToggle").onclick = () => { const s=$("io").style; s.display = s.display==="none" ? "" : "none"; };
$("ioOut").onclick = () => { $("ioText").value = JSON.stringify(st); $("ioText").select(); };
$("ioIn").onclick = () => {
  try { const v = JSON.parse($("ioText").value); if(!v.entries) throw 0;
    if (!confirm("いまの記録を置き換えます。よいですか？")) return;
    st = v; st.used = st.used || []; save(); start();
  } catch(e){ alert("読み込めない形式です"); }
};

start();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
