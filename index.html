<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="返し">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>返し</title>
<style>
:root{
  --bg:#f4f2ee; --ink:#141414; --mid:#6b6b6b; --faint:#cfccc6; --card:#ffffff;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e0e0e; --ink:#ecebe8; --mid:#8d8c89; --faint:#2c2c2c; --card:#171717; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  display:flex;flex-direction:column;min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;height:52px;
  font-size:12px;letter-spacing:.12em;color:var(--mid)}
header button{padding:8px 0 8px 12px;color:var(--mid);letter-spacing:.12em}
main{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
.label{font-size:11px;letter-spacing:.2em;color:var(--mid);margin:18px 0 10px}
.q{font-family:var(--serif);font-size:26px;line-height:1.5;letter-spacing:.02em}
.sub{font-size:13px;color:var(--mid);line-height:1.7}
.btn{border:1px solid var(--ink);border-radius:999px;padding:14px 22px;font-size:15px;
  letter-spacing:.06em;text-align:center}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--faint);color:var(--mid)}
.btn:disabled{opacity:.3}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.spacer{flex:1}
.foot{padding:16px 0 20px;display:flex;flex-direction:column;gap:10px}

/* ask */
.answers{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px;align-content:flex-start;min-height:40px}
.chip{border:1px solid var(--faint);border-radius:999px;padding:8px 13px;font-size:14px;line-height:1.4;
  animation:pop .25s ease-out}
.chip i{font-style:normal;font-size:10px;color:var(--mid);margin-right:6px;letter-spacing:.05em}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.live{min-height:24px;font-size:15px;color:var(--mid);font-family:var(--serif);margin:6px 0}
.count{font-size:12px;color:var(--mid);letter-spacing:.1em}
.mic{width:88px;height:88px;border-radius:50%;border:1px solid var(--ink);margin:6px auto 4px;
  display:flex;align-items:center;justify-content:center;position:relative}
.mic svg{width:30px;height:30px}
.mic.rec{background:var(--ink);color:var(--bg)}
.mic.rec::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid var(--ink);
  animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.8}to{transform:scale(1.25);opacity:0}}
.type{display:flex;gap:8px;margin-top:8px}
.type input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--faint);
  font:inherit;font-size:15px;color:var(--ink);padding:8px 2px;outline:none;border-radius:0}
.type button{font-size:13px;color:var(--mid);padding:0 4px}
.hint{border:1px solid var(--ink);border-radius:14px;padding:14px 16px;margin:12px 0 0;display:none;
  animation:pop .25s ease-out}
.hint.on{display:block}
.hint b{font-size:12px;letter-spacing:.15em;display:block;margin-bottom:6px}
.hint p{font-family:var(--serif);font-size:16px;line-height:1.6}

/* pick */
.circle{position:relative;width:min(92vw,440px);aspect-ratio:1;margin:10px auto 0}
.circle .ring{position:absolute;inset:14%;border:1px solid var(--faint);border-radius:50%}
.circle .center{position:absolute;inset:26%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:10px;font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--mid)}
.circle .center.sel{color:var(--ink)}
.dot{position:absolute;transform:translate(-50%,-50%);max-width:27%;border:1px solid var(--faint);background:var(--bg);
  border-radius:999px;padding:6px 10px;font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:all .2s}
.dot.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* masters */
.mine{border-left:2px solid var(--ink);padding:4px 0 4px 12px;font-family:var(--serif);font-size:16px;line-height:1.6;margin-bottom:6px}
.cards{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.card{border:1px solid var(--faint);border-radius:16px;padding:18px;min-height:74px;background:var(--card);text-align:left;width:100%}
.card.shut{display:flex;align-items:center;justify-content:center;color:var(--mid);font-size:13px;letter-spacing:.2em;background:transparent;border-style:dashed}
.card .t{font-size:11px;letter-spacing:.18em;color:var(--mid);margin-bottom:8px;display:flex;justify-content:space-between}
.card .r{font-family:var(--serif);font-size:17px;line-height:1.7}
.card .w{font-size:12px;color:var(--mid);margin-top:10px;line-height:1.6}
.card.open{animation:pop .3s ease-out}
.same{font-size:10px;border:1px solid var(--ink);color:var(--ink);border-radius:999px;padding:1px 7px;letter-spacing:.05em}

/* recall */
.reveal{margin-top:22px;min-height:80px;font-family:var(--serif);font-size:19px;line-height:1.6}
.reveal.hide{color:transparent;text-shadow:0 0 12px var(--mid);user-select:none}

/* done / book */
.big{font-family:var(--serif);font-size:56px;text-align:center;margin-top:40px}
.center-t{text-align:center}
.book-item{border-top:1px solid var(--faint);padding:14px 0}
.book-item .d{font-size:11px;color:var(--mid);letter-spacing:.1em}
.book-item .qq{font-size:13px;color:var(--mid);margin:4px 0}
.book-item .aa{font-family:var(--serif);font-size:16px;line-height:1.6}
.tiny{font-size:12px;color:var(--mid);text-decoration:underline;text-underline-offset:3px;padding:8px 0}
textarea.io{width:100%;height:120px;background:transparent;color:var(--ink);border:1px solid var(--faint);border-radius:10px;padding:10px;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<header>
  <span id="streak">返し</span>
  <button id="toBook">ネタ帳</button>
</header>
<main>

<!-- 昨日の一本を思い出す -->
<section class="screen" id="s-recall">
  <div class="label">きのうの一本 ── 見ずに、声に出す</div>
  <div class="q" id="rq"></div>
  <div class="reveal hide" id="ra"></div>
  <div class="spacer"></div>
  <div class="foot" id="rfoot1">
    <button class="btn" id="rShow">言った。答えを見る</button>
  </div>
  <div class="foot" id="rfoot2" style="display:none">
    <div class="row">
      <button class="btn ghost" id="rNo">出なかった</button>
      <button class="btn fill" id="rYes">言えた</button>
    </div>
  </div>
</section>

<!-- 問いに声で答える -->
<section class="screen" id="s-ask">
  <div class="label">きょうの問い</div>
  <div class="q" id="q"></div>
  <div class="answers" id="answers"></div>
  <div class="live" id="live"></div>
  <div class="hint" id="hint"><b id="hintName"></b><p id="hintText"></p></div>
  <div class="spacer"></div>
  <div class="foot">
    <div class="count" id="count" style="text-align:center"></div>
    <button class="mic" id="mic" aria-label="声で答える">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <div class="type"><input id="typed" placeholder="声が使えないときは、ここに" enterkeyhint="done"><button id="typedAdd">足す</button></div>
    <div class="row">
      <button class="btn ghost" id="hintBtn">ヒント</button>
      <button class="btn fill" id="toPick" disabled>一本えらぶ</button>
    </div>
    <button class="tiny" id="reroll">別の問いにする</button>
  </div>
</section>

<!-- 丸の中から一本 -->
<section class="screen" id="s-pick">
  <div class="label">一本えらぶ</div>
  <div class="q" id="pq" style="font-size:18px"></div>
  <div class="circle" id="circle"><div class="ring"></div><div class="center" id="center">触れて、えらぶ</div></div>
  <div class="spacer"></div>
  <div class="foot">
    <div class="row">
      <button class="btn ghost" id="back">もっと言う</button>
      <button class="btn fill" id="decide" disabled>これにする</button>
    </div>
  </div>
</section>

<!-- 名人の返し -->
<section class="screen" id="s-master">
  <div class="label">あなたの一本</div>
  <div class="mine" id="mine"></div>
  <div class="label">名人なら ── めくる</div>
  <div class="cards" id="cards"></div>
  <div class="spacer"></div>
  <div class="foot"><button class="btn fill" id="finish" disabled>きょうはおわり</button></div>
</section>

<!-- おわり -->
<section class="screen" id="s-done">
  <div class="big" id="dnum"></div>
  <div class="sub center-t" id="dtext"></div>
  <div class="spacer"></div>
  <div class="foot">
    <button class="btn ghost" id="again">もう一問</button>
  </div>
</section>

<!-- ネタ帳 -->
<section class="screen" id="s-book">
  <div class="label" id="bookHead">ネタ帳</div>
  <div id="book"></div>
  <div class="foot">
    <button class="tiny" id="ioToggle">引っ越し（書き出し／読み込み）</button>
    <div id="io" style="display:none">
      <textarea class="io" id="ioText"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost" id="ioOut">書き出す</button>
        <button class="btn ghost" id="ioIn">読み込む</button>
      </div>
    </div>
    <button class="btn" id="bookBack">もどる</button>
  </div>
</section>

</main>
<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = "kaeshi-v1";
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };

// ---- 保存 ----
let st;
try { st = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { st = {}; }
st.entries = st.entries || [];   // {date, qid, q, answers:[{t,h}], pick, hint}
st.recall  = st.recall  || {};   // {date: entryIndex}
st.draft   = st.draft   || null; // 途中の {date, qid, answers}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };

// ---- 問いの選び方：まだ答えていない問いを、日付で決まる順に ----
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function pickQid(salt=0){
  const done = new Set(st.entries.map(e=>e.qid));
  let pool = QUESTIONS.filter(q=>!done.has(q.id));
  if (!pool.length) pool = QUESTIONS;       // 一巡したら、また最初から
  return pool[hash(today()+":"+salt) % pool.length].id;
}
const Q = id => QUESTIONS.find(q=>q.id===id);

// ---- 画面 ----
function show(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id==="s-"+name));
  window.scrollTo(0,0);
}
function streak(){
  const days = new Set(st.entries.map(e=>e.date));
  let n=0, d=new Date();
  if (!days.has(today())) d.setDate(d.getDate()-1);
  for(;;){ const k=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); if(!days.has(k)) break; n++; d.setDate(d.getDate()-1); }
  $("streak").textContent = n ? `返し　${n}日` : "返し";
  return n;
}

// ---- 起動 ----
let cur, salt = 0;
function start(){
  streak();
  // 前の日以前の一本で、まだ思い出していないものがあれば先に
  const due = st.entries.findIndex(e => e.date < today() && !e.recalled && (e.nextRecall||"") <= today());
  if (due >= 0 && st.recall.date !== today()) return showRecall(due);
  beginAsk();
}
function beginAsk(){
  if (st.draft && st.draft.date === today()) cur = st.draft;
  else { cur = { date: today(), qid: pickQid(salt), answers: [] }; st.draft = cur; save(); }
  renderAsk(); show("ask");
}

// ---- 思い出す ----
let rIdx;
function showRecall(i){
  rIdx = i; const e = st.entries[i];
  $("rq").textContent = e.q; $("ra").textContent = e.pick; $("ra").classList.add("hide");
  $("rfoot1").style.display=""; $("rfoot2").style.display="none";
  show("recall");
}
$("rShow").onclick = () => { $("ra").classList.remove("hide"); $("rfoot1").style.display="none"; $("rfoot2").style.display=""; };
function recallDone(ok){
  const e = st.entries[rIdx];
  e.tries = (e.tries||0)+1;
  if (ok){ e.hits=(e.hits||0)+1; }
  // 言えたら 3日後→7日後に間を広げ、2回言えたら卒業。出なければ翌日また。
  const gap = ok ? (e.hits>=2 ? null : 3) : 1;
  if (gap===null) e.recalled = true;
  else { const d=new Date(); d.setDate(d.getDate()+gap); e.nextRecall = new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
  st.recall.date = today(); save(); beginAsk();
}
$("rYes").onclick = () => recallDone(true);
$("rNo").onclick  = () => recallDone(false);

// ---- 答える ----
let curHint = null;
function renderAsk(){
  $("q").textContent = Q(cur.qid).q;
  const box = $("answers"); box.innerHTML = "";
  cur.answers.forEach(a=>{
    const c=document.createElement("span"); c.className="chip";
    c.innerHTML = (a.h?`<i>${a.h}</i>`:"") ; c.append(a.t); box.append(c);
  });
  const n = cur.answers.length;
  $("count").textContent = n===0 ? "声に出して答える。何本でも" : n<3 ? `${n}本 ── まず3本` : n<10 ? `${n}本 ── 10本までいける` : `${n}本 ── じゅうぶん`;
  $("toPick").disabled = n<2;
}
function addAnswer(t){
  t = t.trim().replace(/[。\s]+$/,""); if(!t) return;
  cur.answers.push({ t, h: curHint ? curHint.name : "" });
  st.draft = cur; save(); renderAsk();
}
$("typedAdd").onclick = () => { addAnswer($("typed").value); $("typed").value=""; };
$("typed").onkeydown = e => { if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); $("typedAdd").click(); } };

// ヒント：押すたびに別の型
let hintOrder = [], hintPos = 0;
$("hintBtn").onclick = () => {
  if (!hintOrder.length){ hintOrder = HINTS.map((_,i)=>i).sort((a,b)=>hash(today()+cur.qid+a)-hash(today()+cur.qid+b)); }
  curHint = HINTS[hintOrder[hintPos++ % hintOrder.length]];
  $("hintName").textContent = curHint.name; $("hintText").textContent = curHint.ask;
  $("hint").classList.remove("on"); void $("hint").offsetWidth; $("hint").classList.add("on");
  $("hintBtn").textContent = "別のヒント";
};
$("reroll").onclick = () => {
  if (cur.answers.length && !confirm("いまの答えは消えます。別の問いにしますか？")) return;
  salt++; cur = { date: today(), qid: pickQid(salt), answers: [] }; st.draft = cur; save();
  curHint=null; hintOrder=[]; hintPos=0; $("hint").classList.remove("on"); $("hintBtn").textContent="ヒント";
  renderAsk();
};

// 声
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false, finalText = "";
if (!SR) { $("mic").style.opacity=.3; $("live").textContent = "この端末では声が使えない。下の欄に書くか、キーボードのマイクで"; }
$("mic").onclick = () => {
  if (!SR) { $("typed").focus(); return; }
  if (recOn) { rec.stop(); return; }
  rec = new SR(); rec.lang = "ja-JP"; rec.interimResults = true; rec.continuous = false;
  finalText = "";
  rec.onresult = e => {
    let interim = "";
    for (let i=e.resultIndex;i<e.results.length;i++){
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
    }
    $("live").textContent = finalText + interim;
  };
  rec.onend = () => { recOn=false; $("mic").classList.remove("rec"); if(finalText) addAnswer(finalText); $("live").textContent=""; };
  rec.onerror = ev => { $("live").textContent = ev.error==="not-allowed" ? "マイクが許可されていない" : ""; };
  rec.start(); recOn = true; $("mic").classList.add("rec"); $("live").textContent = "……";
};

// ---- 丸から一本 ----
let sel = -1;
$("toPick").onclick = () => { if (recOn) rec.stop(); renderPick(); show("pick"); };
function renderPick(){
  $("pq").textContent = Q(cur.qid).q;
  const c = $("circle"); c.querySelectorAll(".dot").forEach(d=>d.remove());
  sel = -1; $("decide").disabled = true; $("center").textContent = "触れて、えらぶ"; $("center").classList.remove("sel");
  const n = cur.answers.length;
  cur.answers.forEach((a,i)=>{
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const r = n>8 && i%2 ? 28 : 36;          // 多いときは内外に互い違い
    const d = document.createElement("button"); d.className="dot";
    d.style.left = (50 + r*Math.cos(ang))+"%"; d.style.top = (50 + r*Math.sin(ang))+"%";
    d.textContent = a.t;
    d.onclick = () => {
      c.querySelectorAll(".dot").forEach(x=>x.classList.remove("sel")); d.classList.add("sel");
      sel = i; $("center").textContent = a.t; $("center").classList.add("sel"); $("decide").disabled = false;
    };
    c.append(d);
  });
}
$("back").onclick = () => show("ask");
$("decide").onclick = () => {
  if (!st.draft || sel < 0) return;          // 二度押しで二重に入れない
  $("decide").disabled = true;
  const a = cur.answers[sel], q = Q(cur.qid);
  st.entries.push({ date: cur.date, qid: cur.qid, q: q.q, answers: cur.answers, pick: a.t, hint: a.h });
  st.draft = null; save(); streak();
  renderMasters(a); show("master");
};

// ---- 名人の返し ----
function renderMasters(a){
  $("mine").textContent = a.t;
  const box = $("cards"); box.innerHTML = "";
  const ms = Q(cur.qid).m; let opened = 0;
  ms.forEach((m,i)=>{
    const c = document.createElement("button"); c.className = "card shut";
    c.textContent = ["一","二","三"][i] + "　めくる";
    c.onclick = () => {
      if (!c.classList.contains("shut")) return;
      c.className = "card open";
      const same = a.h && a.h === m.type ? `<span class="same">あなたと同じ型</span>` : "";
      c.innerHTML = `<div class="t"><span>${m.type}</span>${same}</div><div class="r"></div><div class="w"></div>`;
      c.querySelector(".r").textContent = "「" + m.r + "」";
      c.querySelector(".w").textContent = m.w;
      if (++opened === ms.length) $("finish").disabled = false;
    };
    box.append(c);
  });
  $("finish").disabled = true;
}
$("finish").onclick = () => {
  const n = streak(), total = st.entries.length;
  $("dnum").textContent = total;
  $("dtext").innerHTML = `本目がネタ帳に入った。<br>${n>1?`${n}日つづいている。<br>`:""}あした、見ずに言えるか試す。`;
  show("done");
};
$("again").onclick = () => { salt++; beginAsk(); };

// ---- ネタ帳 ----
$("toBook").onclick = () => {
  const b = $("book"); b.innerHTML = "";
  $("bookHead").textContent = `ネタ帳　${st.entries.length}本`;
  if (!st.entries.length) b.innerHTML = `<p class="sub">まだ空。一本えらぶと、ここに入る。</p>`;
  [...st.entries].reverse().forEach(e=>{
    const d = document.createElement("div"); d.className="book-item";
    d.innerHTML = `<div class="d"></div><div class="qq"></div><div class="aa"></div>`;
    d.querySelector(".d").textContent = e.date + (e.hint?`　${e.hint}`:"") + (e.recalled?"　身についた":"");
    d.querySelector(".qq").textContent = e.q; d.querySelector(".aa").textContent = e.pick;
    b.append(d);
  });
  show("book");
};
$("bookBack").onclick = () => start();
$("ioToggle").onclick = () => { const s=$("io").style; s.display = s.display==="none" ? "" : "none"; };
$("ioOut").onclick = () => { $("ioText").value = JSON.stringify(st); $("ioText").select(); };
$("ioIn").onclick = () => {
  try { const v = JSON.parse($("ioText").value); if(!v.entries) throw 0;
    if (!confirm("いまの記録を置き換えます。よいですか？")) return;
    st = v; save(); start();
  } catch(e){ alert("読み込めない形式です"); }
};

start();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
